<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strava Group Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="hero">
        <div class="container">
            <div class="hero-content">
                <div class="hero-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                </div>
                <h1>Strava Group Tracker</h1>
                <p class="subtitle">Real-time stats &amp; awards for our running group</p>
                <div class="hero-stats" id="heroStats">
                    <div class="hero-stat">
                        <span class="hero-stat-value" id="totalMembers">--</span>
                        <span class="hero-stat-label">Members</span>
                    </div>
                    <div class="hero-stat">
                        <span class="hero-stat-value" id="totalActivities">--</span>
                        <span class="hero-stat-label">Activities</span>
                    </div>
                    <div class="hero-stat">
                        <span class="hero-stat-value" id="totalDistance">--</span>
                        <span class="hero-stat-label">km Total</span>
                    </div>
                    <div class="hero-stat">
                        <span class="hero-stat-value" id="totalElevation">--</span>
                        <span class="hero-stat-label">m Climbed</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <nav class="tabs-nav">
        <div class="container">
            <div class="tabs">
                <button class="tab active" data-tab="awards">Awards</button>
                <button class="tab" data-tab="leaderboard">Leaderboard</button>
                <button class="tab" data-tab="activities">Recent Activities</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- This Week Section (always visible above tabs) -->
        <section class="this-week-section" id="thisWeekSection">
            <div class="this-week-header">
                <h2 class="section-title">This Week <span class="week-dates" id="weekDates"></span></h2>
            </div>
            <div class="this-week-stats" id="thisWeekStats"></div>
            <div class="this-week-activities" id="thisWeekActivities"></div>
        </section>

        <!-- Awards Tab -->
        <section id="awards" class="tab-content active">
            <div class="awards-section">
                <h2 class="section-title">Performance Awards</h2>
                <div class="awards-grid" id="performanceAwards"></div>
            </div>
            <div class="awards-section">
                <h2 class="section-title">Inclusive &amp; Motivational Awards</h2>
                <div class="awards-grid" id="motivationalAwards"></div>
            </div>
        </section>

        <!-- Leaderboard Tab -->
        <section id="leaderboard" class="tab-content">
            <div class="leaderboard-controls">
                <select id="leaderboardMetric" class="select-control">
                    <option value="distance">Total Distance</option>
                    <option value="elevation">Total Elevation</option>
                    <option value="activities">Activity Count</option>
                    <option value="moving_time">Total Moving Time</option>
                </select>
                <select id="leaderboardPeriod" class="select-control">
                    <option value="all">All Time</option>
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                </select>
            </div>
            <div class="leaderboard-table" id="leaderboardTable"></div>
        </section>

        <!-- Activities Tab -->
        <section id="activities" class="tab-content">
            <div class="activity-filters">
                <select id="activityTypeFilter" class="select-control">
                    <option value="all">All Activities</option>
                    <option value="Run">Runs</option>
                    <option value="Walk">Walks</option>
                    <option value="Hike">Hikes</option>
                </select>
            </div>
            <div class="activities-list" id="activitiesList"></div>
        </section>

        <div class="last-updated" id="lastUpdated"></div>

        <!-- Strava Club Widgets -->
        <section class="strava-widgets">
            <h2 class="section-title">Strava Club Feed</h2>
            <div class="widgets-grid">
                <div class="widget-card">
                    <iframe allowtransparency="true" frameborder="0" height="160" scrolling="no" src="https://www.strava.com/clubs/2172779/latest-rides/d679a7d794dccaada1967c0074d4ff514dbf4622?show_rides=false" width="300"></iframe>
                </div>
                <div class="widget-card">
                    <iframe allowtransparency="true" frameborder="0" height="454" scrolling="no" src="https://www.strava.com/clubs/2172779/latest-rides/d679a7d794dccaada1967c0074d4ff514dbf4622?show_rides=true" width="300"></iframe>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>Data synced automatically from Strava every 4 hours</p>
            <p class="footer-note">Powered by the Strava API</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
