<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHR Activity Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="SHR2.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Hero -->
    <header class="hero">
        <div class="hero-bg"></div>
        <div class="container hero-inner">
            <div class="hero-brand">
                <img src="SHR2.png" alt="SHR Logo" class="hero-logo">
                <div>
                    <h1>SHR Activity Tracker</h1>
                    <p class="hero-subtitle">Strava Group Challenge — June 2026</p>
                </div>
            </div>
            <div class="hero-stats" id="heroStats">
                <div class="hero-stat animate-in">
                    <span class="hero-stat-value" id="totalMembers">--</span>
                    <span class="hero-stat-label">Members</span>
                </div>
                <div class="hero-stat animate-in">
                    <span class="hero-stat-value" id="totalActivities">--</span>
                    <span class="hero-stat-label">Activities</span>
                </div>
                <div class="hero-stat animate-in">
                    <span class="hero-stat-value" id="totalDistance">--</span>
                    <span class="hero-stat-label">km Total</span>
                </div>
                <div class="hero-stat animate-in">
                    <span class="hero-stat-value" id="totalElevation">--</span>
                    <span class="hero-stat-label">m Climbed</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Tabs -->
    <nav class="tabs-nav" id="tabsNav">
        <div class="container">
            <div class="tabs" role="tablist">
                <button class="tab active" data-tab="thisweek" role="tab">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    This Week
                </button>
                <button class="tab" data-tab="awards" role="tab">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
                    Awards
                </button>
                <button class="tab" data-tab="leaderboard" role="tab">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                    Leaderboard
                </button>
                <button class="tab" data-tab="activities" role="tab">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                    All Activities
                </button>
            </div>
        </div>
    </nav>

    <!-- Tab Content -->
    <main class="main-content">
        <div class="container container-wide">

            <!-- This Week -->
            <section id="tab-thisweek" class="tab-panel active">
                <div class="section-header">
                    <h2>This Week <span class="week-dates" id="weekDates"></span></h2>
                </div>
                <div class="week-stats-grid" id="thisWeekStats"></div>
                <div class="panel-with-sidebar">
                    <div class="panel-main">
                        <div class="activity-scroll-container">
                            <div class="activities-list" id="thisWeekActivities"></div>
                        </div>
                    </div>
                    <aside class="panel-sidebar">
                        <div class="sidebar-widget sidebar-widget-fill">
                            <div class="sidebar-widget-label">Latest on Strava</div>
                            <iframe allowtransparency="true" frameborder="0" scrolling="yes" src="https://www.strava.com/clubs/2172779/latest-rides/d679a7d794dccaada1967c0074d4ff514dbf4622?show_rides=true" width="300"></iframe>
                        </div>
                    </aside>
                </div>
            </section>

            <!-- Awards -->
            <section id="tab-awards" class="tab-panel">
                <div class="awards-group">
                    <div class="section-header">
                        <div class="section-icon accent">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        </div>
                        <h2>Performance Awards</h2>
                    </div>
                    <div class="awards-grid" id="performanceAwards"></div>
                </div>
                <div class="awards-group">
                    <div class="section-header">
                        <div class="section-icon warm">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                        </div>
                        <h2>Motivational Awards</h2>
                    </div>
                    <div class="awards-grid" id="motivationalAwards"></div>
                </div>
            </section>

            <!-- Leaderboard -->
            <section id="tab-leaderboard" class="tab-panel">
                <div class="leaderboard-controls">
                    <div class="select-wrapper">
                        <select id="leaderboardMetric" class="select-control">
                            <option value="distance">Total Distance</option>
                            <option value="elevation">Total Elevation</option>
                            <option value="activities">Activity Count</option>
                            <option value="moving_time">Total Moving Time</option>
                        </select>
                    </div>
                    <div class="select-wrapper">
                        <select id="leaderboardPeriod" class="select-control">
                            <option value="all">All Time</option>
                            <option value="week">This Week</option>
                            <option value="month">This Month</option>
                        </select>
                    </div>
                </div>
                <div class="leaderboard-table" id="leaderboardTable"></div>
            </section>

            <!-- All Activities -->
            <section id="tab-activities" class="tab-panel">
                <div class="leaderboard-controls">
                    <div class="select-wrapper">
                        <select id="weekFilter" class="select-control"></select>
                    </div>
                    <div class="select-wrapper">
                        <select id="activityTypeFilter" class="select-control">
                            <option value="all">All Activities</option>
                            <option value="Run">Runs</option>
                            <option value="Walk">Walks</option>
                            <option value="Hike">Hikes</option>
                        </select>
                    </div>
                </div>
                <div class="panel-with-sidebar">
                    <div class="panel-main">
                        <div class="activity-scroll-container">
                            <div class="activities-list" id="activitiesList"></div>
                        </div>
                    </div>
                    <aside class="panel-sidebar">
                        <div class="sidebar-widget sidebar-widget-fill">
                            <div class="sidebar-widget-label">Latest on Strava</div>
                            <iframe allowtransparency="true" frameborder="0" scrolling="yes" src="https://www.strava.com/clubs/2172779/latest-rides/d679a7d794dccaada1967c0074d4ff514dbf4622?show_rides=true" width="300"></iframe>
                        </div>
                    </aside>
                </div>
            </section>

        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-inner">
                <img src="SHR2.png" alt="SHR" class="footer-logo">
                <div>
                    <p>Data synced automatically from Strava every 15 minutes</p>
                    <p class="footer-note" id="lastUpdated"></p>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
